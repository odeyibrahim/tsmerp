<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>NaijaHaul</title>
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#0b6b3a">
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" href="/icons/icon-192.png">
    <link rel="apple-touch-icon" href="/icons/icon-180.png">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
    <a class="skip-link" href="#view">Skip to content</a>
    <div id="boot" class="boot"><div class="spinner" aria-label="Loading"></div></div>
    <div id="shell" class="shell" hidden>
        <aside class="sidebar" id="sidebar">
            <div class="brand">NaijaHaul</div>
            <nav id="nav" aria-label="Main"></nav>
        </aside>
        <div class="main">
            <header class="topbar">
                <button class="icon-btn menu-btn" data-action="shell:menu" aria-label="Menu">☰</button>
                <div id="company-switch"></div>
                <div id="user-menu" class="user-menu"></div>
            </header>
            <main id="view" tabindex="-1"></main>
        </div>
    </div>
    <div id="modal-root"></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <noscript>This app needs JavaScript enabled.</noscript>
    <script type="module" src="/js/app.js"></script>
</body>
</html>
